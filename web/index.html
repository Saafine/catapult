<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hamsters</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="mq_js_bundle.js"></script>
  <script src="sapp_jsutils.js"></script>
  <script src="quad_storage.js"></script>
  <script>load("hamsters.wasm");</script>
<script>
  // Tab title follows the active asset pack.
  fetch('packs/active.json').then(r => r.json()).then(a => fetch(`packs/${a.pack}/pack.json`)).then(r => r.json()).then(p => { document.title = p.title; }).catch(() => {});
</script>
</body>
</html>
