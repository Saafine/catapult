[package]
name = "hamsters"
version = "0.1.0"
edition = "2021"
description = "macroquad runtime: rendering, input, audio. Builds native and wasm."

[dependencies]
hamsters-core = { path = "../core" }
hamsters-synth = { path = "../synth" }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quad-storage = "0.1"

[features]
# Dev-only keys (P = perfect launch). Used for automated screenshots; never ship.
devkeys = []
